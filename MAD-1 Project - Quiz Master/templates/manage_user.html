{% extends 'base.html' %}

{% block title %} Manage Users {% endblock %}

{% block content %}
    <h1>Manage Users</h1>
    
    <table class = "scrollable-table-container">
        <tr>
            <th>Name</th>
            <th>Email</th>
            <th>Actions</th>
        </tr>
        {%for user in users %}
            <tr>
                <td>{{user.username}}</td>
                <td>{{user.email}}</td>
                <td>
                    <a class="btn btn-danger" href="{{url_for('delete_user',id = user.id)}}">Delete</a>
                </td>
            </tr>
        {%endfor %}
    </table>

    <div class="card mt-4">
        <div class="card-header">
            <h3 class="card-title">Subject-wise Average Scores</h3>
        </div>
        <div class="card-body text-center">
            <div id="bar_chart"></div>
        </div>
    </div>

    <div class="card mt-4">
        <div class="card-header">
            <h3 class="card-title">Score Trends Over Time</h3>
        </div>
        <div class="card-body text-center">
            <div id="line_chart"></div>
        </div>
    </div>

    <!-- Plotly Charts -->
    <script>
        (function() {
            const barChartData = {{ bar_chart | default('null') | safe }};
            if (barChartData) {
                Plotly.newPlot('bar_chart', barChartData.data, barChartData.layout, {responsive: true});
            }

            const lineChartData = {{ line_chart | default('null') | safe }};
            if (lineChartData) {
                Plotly.newPlot('line_chart', lineChartData.data, lineChartData.layout, {responsive: true});
            }
        })();
    </script>
{% endblock %}
